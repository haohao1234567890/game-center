<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏中心入口</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .loader { animation: pulse 1.5s infinite; }
        .fade-out { animation: fadeOut 0.5s forwards; }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 to-blue-900 min-h-screen flex flex-col items-center justify-center text-white p-4">
    <!-- 游戏中心LOGO -->
    <div class="text-center mb-8">
        <i class="fa fa-gamepad text-6xl text-yellow-400 loader mb-4"></i>
        <h1 class="text-3xl md:text-4xl font-bold mb-2">复古游戏中心</h1>
        <p class="text-gray-300">经典游戏，一键畅玩</p>
    </div>

    <!-- 跳转提示 -->
    <div class="bg-black/50 backdrop-blur-sm p-6 rounded-xl border border-yellow-400/30 w-full max-w-md text-center">
        <p class="mb-4">正在进入游戏中心主程序...</p>
        <div class="flex items-center justify-center gap-2 mb-6">
            <span class="text-yellow-400 text-xl font-bold" id="countdown">3</span>
            <span>秒后自动跳转</span>
        </div>
        
        <!-- 手动跳转按钮 -->
        <button id="jump-btn" class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-3 px-8 rounded-lg transition-all active:scale-95">
            <i class="fa fa-arrow-right mr-2"></i> 立即进入
        </button>
        
        <!-- 错误提示（默认隐藏） -->
        <div id="error-msg" class="mt-4 text-red-400 hidden">
            <i class="fa fa-exclamation-triangle mr-2"></i> 主程序文件不存在，请检查路径
        </div>
    </div>

    <!-- 页脚 -->
    <div class="mt-auto text-gray-400 text-sm">
        © 2026 复古游戏中心 | 体验优化版
    </div>

    <script>
        // 配置主程序路径（指向游戏选择页面）
        const MAIN_PROGRAM_URL = "游戏中心主页面.html"; 
        let countdown = 3;
        const countdownEl = document.getElementById('countdown');
        const jumpBtn = document.getElementById('jump-btn');
        const errorMsg = document.getElementById('error-msg');
        const bodyEl = document.body;

        // 倒计时逻辑
        const timer = setInterval(() => {
            countdown--;
            countdownEl.textContent = countdown;
            if (countdown <= 0) {
                clearInterval(timer);
                jumpToMainProgram();
            }
        }, 1000);

        // 跳转主程序函数
        function jumpToMainProgram() {
            try {
                // 添加跳转动画
                bodyEl.classList.add('fade-out');
                setTimeout(() => {
                    window.location.href = MAIN_PROGRAM_URL;
                }, 500);
            } catch (e) {
                errorMsg.classList.remove('hidden');
                console.error('跳转失败:', e);
            }
        }

        // 手动跳转事件
        jumpBtn.addEventListener('click', () => {
            clearInterval(timer);
            jumpToMainProgram();
        });

        // 监听页面加载失败
        window.addEventListener('error', (e) => {
            if (e.filename.includes(MAIN_PROGRAM_URL)) {
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
