<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛车游戏 | 复古游戏中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        #gameCanvas {
            touch-action: none;
            image-rendering: pixelated;
        }
        .control-btn {
            touch-action: manipulation;
            min-width: 70px;
            min-height: 70px;
        }
        .speed-indicator {
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center justify-center p-4 text-white">
    <!-- 加载遮罩层 -->
    <div id="loader" class="fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-50">
        <i class="fa fa-circle-o-notch fa-spin text-5xl text-red-500 mb-4"></i>
        <p class="text-white text-xl">赛车游戏加载中...</p>
    </div>

    <!-- 移动端横屏提示 -->
    <div class="md:hidden bg-red-500/20 text-red-300 p-2 text-center text-sm rounded-lg mb-4 w-full max-w-md">
        <i class="fa fa-mobile-phone fa-rotate-90 mr-2"></i> 建议横屏游玩体验更佳
    </div>

    <!-- 游戏容器 -->
    <div class="relative mb-6">
        <canvas id="gameCanvas" width="400" height="600" class="border-4 border-gray-700 rounded-lg bg-gray-800 max-w-full"></canvas>
        
        <!-- 游戏信息 -->
        <div class="absolute top-4 left-4 right-4 flex justify-between">
            <div class="bg-black/70 p-2 rounded-lg">
                <div class="text-xs text-gray-400">分数</div>
                <div id="score" class="text-xl font-bold text-yellow-400">0</div>
            </div>
            <div class="bg-black/70 p-2 rounded-lg">
                <div class="text-xs text-gray-400">速度</div>
                <div id="speed" class="text-xl font-bold text-red-400 speed-indicator">0</div>
            </div>
        </div>
        
        <!-- 游戏结束提示 -->
        <div id="gameOver" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center hidden">
            <h2 class="text-3xl font-bold text-red-500 mb-4">游戏结束!</h2>
            <p class="mb-4">最终得分: <span id="finalScore" class="text-2xl font-bold text-yellow-400">0</span></p>
            <button id="restartBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg transition-all active:scale-95">
                <i class="fa fa-refresh mr-2"></i>重新开始
            </button>
        </div>
    </div>

    <!-- 移动端控制按钮 -->
    <div class="md:hidden grid grid-cols-2 gap-4 w-full max-w-md mb-6">
        <button id="leftBtn" class="control-btn bg-gray-700 hover:bg-gray-600 text-white rounded-full flex items-center justify-center text-3xl transition-all active:scale-95">
            <i class="fa fa-arrow-left"></i>
        </button>
        <button id="rightBtn" class="control-btn bg-gray-700 hover:bg-gray-600 text-white rounded-full flex items-center justify-center text-3xl transition-all active:scale-95">
            <i class="fa fa-arrow-right"></i>
        </button>
    </div>

    <!-- 操作提示 -->
    <div class="text-center text-gray-400 mb-6">
        <p class="md:block hidden"><i class="fa fa-keyboard-o mr-2"></i>使用 ← → 方向键控制赛车移动</p>
        <p class="md:hidden"><i class="fa fa-hand-pointer-o mr-2"></i>点击按钮控制赛车左右移动</p>
    </div>

    <script>
        // 游戏常量
        const CANVAS_WIDTH = 400;
        const CANVAS_HEIGHT = 600;
        const ROAD_WIDTH = 300;
        const LANE_COUNT = 3;
        const LANE_WIDTH = ROAD_WIDTH / LANE_COUNT;
        
        // 游戏变量
        let canvas, ctx;
        let car = {
            x: CANVAS_WIDTH / 2 - 25,
            y: CANVAS_HEIGHT - 120,
            width: 50,
            height: 80,
            speed: 5,
            lane: 1 // 0, 1, 2
        };
        let obstacles = [];
        let score = 0;
        let gameSpeed = 5;
        let isGameOver = false;
        let gameLoopId;
        let lastObstacleTime = 0;
        const OBSTACLE_INTERVAL = 1500; // 障碍物生成间隔(ms)
        
        // DOM元素
        const scoreDisplay = document.getElementById('score');
        const speedDisplay = document.getElementById('speed');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreDisplay = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        // 初始化游戏
        function initGame() {
            // 获取画布和上下文
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            // 重置游戏状态
            car.x = CANVAS_WIDTH / 2 - 25;
            car.y = CANVAS_HEIGHT - 120;
            car.lane = 1;
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            isGameOver = false;
            gameOverScreen.classList.add('hidden');
            
            // 更新显示
            updateScore();
            updateSpeed();
            
            // 开始游戏循环
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        // 绘制道路
        function drawRoad() {
            // 道路背景
            ctx.fillStyle = '#333';
            ctx.fillRect((CANVAS_WIDTH - ROAD_WIDTH) / 2, 0, ROAD_WIDTH, CANVAS_HEIGHT);
            
            // 道路标线
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 5;
            
            // 左侧边界
            ctx.beginPath();
            ctx.moveTo((CANVAS_WIDTH - ROAD_WIDTH) / 2, 0);
            ctx.lineTo((CANVAS_WIDTH - ROAD_WIDTH) / 2, CANVAS_HEIGHT);
            ctx.stroke();
            
            // 右侧边界
            ctx.beginPath();
            ctx.moveTo((CANVAS_WIDTH + ROAD_WIDTH) / 2, 0);
            ctx.lineTo((CANVAS_WIDTH + ROAD_WIDTH) / 2, CANVAS_HEIGHT);
            ctx.stroke();
            
            // 车道分隔线
            ctx.setLineDash([30, 20]);
            ctx.strokeStyle = '#999';
            
            for (let i = 1; i < LANE_COUNT; i++) {
                const x = (CANVAS_WIDTH - ROAD_WIDTH) / 2 + i * LANE_WIDTH;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, CANVAS_HEIGHT);
                ctx.stroke();
            }
            
            ctx.setLineDash([]);
        }

        // 绘制赛车
        function drawCar() {
            // 赛车主体
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(car.x, car.y, car.width, car.height);
            
            // 赛车窗户
            ctx.fillStyle = '#3498db';
            ctx.fillRect(car.x + 10, car.y + 15, car.width - 20, car.height - 30);
            
            // 赛车轮子
            ctx.fillStyle = '#222';
            const wheelSize = 10;
            
            // 前轮左
            ctx.fillRect(car.x - wheelSize, car.y + car.height - wheelSize, wheelSize, wheelSize);
            // 前轮右
            ctx.fillRect(car.x + car.width, car.y + car.height - wheelSize, wheelSize, wheelSize);
            // 后轮左
            ctx.fillRect(car.x - wheelSize, car.y, wheelSize, wheelSize);
            // 后轮右
            ctx.fillRect(car.x + car.width, car.y, wheelSize, wheelSize);
        }

        // 生成障碍物
        function generateObstacle(timestamp) {
            if (timestamp - lastObstacleTime > OBSTACLE_INTERVAL && !isGameOver) {
                const lane = Math.floor(Math.random() * LANE_COUNT);
                const x = (CANVAS_WIDTH - ROAD_WIDTH) / 2 + lane * LANE_WIDTH + (LANE_WIDTH - 50) / 2;
                
                obstacles.push({
                    x: x,
                    y: -80,
                    width: 50,
                    height: 80,
                    lane: lane
                });
                
                lastObstacleTime = timestamp;
            }
        }

        // 绘制障碍物
        function drawObstacles() {
            obstacles.forEach(obstacle => {
                // 障碍物主体
                ctx.fillStyle = '#f39c12';
                ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                
                // 障碍物细节
                ctx.fillStyle = '#d35400';
                ctx.fillRect(obstacle.x + 5, obstacle.y + 5, obstacle.width - 10, obstacle.height - 10);
            });
        }

        // 更新障碍物位置
        function updateObstacles() {
            obstacles.forEach((obstacle, index) => {
                obstacle.y += gameSpeed;
                
                // 移除超出屏幕的障碍物
                if (obstacle.y > CANVAS_HEIGHT) {
                    obstacles.splice(index, 1);
                    // 加分
                    score += 10;
                    updateScore();
                    
                    // 每100分提升一次速度
                    if (score % 100 === 0) {
                        gameSpeed += 0.5;
                        updateSpeed();
                    }
                }
            });
        }

        // 检测碰撞
        function checkCollision() {
            for (let obstacle of obstacles) {
                if (
                    car.x < obstacle.x + obstacle.width &&
                    car.x + car.width > obstacle.x &&
                    car.y < obstacle.y + obstacle.height &&
                    car.y + car.height > obstacle.y
                ) {
                    // 碰撞发生
                    gameOver();
                    return true;
                }
            }
            return false;
        }

        // 更新分数显示
        function updateScore() {
            scoreDisplay.textContent = score;
            finalScoreDisplay.textContent = score;
            
            // 分数变化动画
            scoreDisplay.style.transform = 'scale(1.2)';
            setTimeout(() => {
                scoreDisplay.style.transform = 'scale(1)';
            }, 200);
        }

        // 更新速度显示
        function updateSpeed() {
            speedDisplay.textContent = Math.floor(gameSpeed * 10);
            
            // 速度变化动画
            speedDisplay.classList.add('scale-110');
            setTimeout(() => {
                speedDisplay.classList.remove('scale-110');
            }, 200);
        }

        // 游戏结束
        function gameOver() {
            isGameOver = true;
            gameOverScreen.classList.remove('hidden');
            cancelAnimationFrame(gameLoopId);
        }

        // 移动赛车
        function moveCar(direction) {
            if (isGameOver) return;
            
            if (direction === 'left' && car.lane > 0) {
                car.lane--;
                car.x = (CANVAS_WIDTH - ROAD_WIDTH) / 2 + car.lane * LANE_WIDTH + (LANE_WIDTH - car.width) / 2;
            } else if (direction === 'right' && car.lane < LANE_COUNT - 1) {
                car.lane++;
                car.x = (CANVAS_WIDTH - ROAD_WIDTH) / 2 + car.lane * LANE_WIDTH + (LANE_WIDTH - car.width) / 2;
            }
        }

        // 游戏主循环
        function gameLoop(timestamp) {
            if (isGameOver) return;
            
            // 清空画布
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // 绘制游戏元素
            drawRoad();
            drawCar();
            
            // 更新游戏状态
            generateObstacle(timestamp);
            updateObstacles();
            drawObstacles();
            
            // 检测碰撞
            checkCollision();
            
            // 继续循环
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            
            if (e.key === 'ArrowLeft') {
                moveCar('left');
            } else if (e.key === 'ArrowRight') {
                moveCar('right');
            }
        });

        // 移动端按钮控制
        leftBtn.addEventListener('click', () => moveCar('left'));
        rightBtn.addEventListener('click', () => moveCar('right'));

        // 重新开始游戏
        restartBtn.addEventListener('click', initGame);

        // 页面加载完成后初始化
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = 0;
                loader.style.transition = 'opacity 0.5s ease';
                setTimeout(() => {
                    loader.style.display = 'none';
                    initGame();
                }, 500);
            }, 500);
        });
    </script>
</body>
</html>
