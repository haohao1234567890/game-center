<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典打砖块 - 复古游戏中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom, #0f172a, #1e40af);
            min-height: 100vh;
            color: #f8fafc;
            overflow: hidden;
        }
        #game-canvas {
            background-color: #1e293b;
            border: 4px solid #fbbf24;
            border-radius: 8px;
        }
    </style>
</head>
<body class="container mx-auto px-4 py-8 flex flex-col items-center">
    <header class="flex justify-between items-center w-full mb-4">
        <a href="index.html" class="text-secondary text-2xl hover:text-yellow-300 transition-colors">
            <i class="fa fa-arrow-left"></i> 返回首页
        </a>
        <h1 class="text-3xl font-bold text-secondary">经典打砖块</h1>
        <div class="w-12"></div>
    </header>

    <div class="flex flex-col md:flex-row justify-center items-center gap-8">
        <!-- 游戏画布容器 -->
        <div class="relative">
            <canvas id="game-canvas" width="600" height="500"></canvas>
            
            <!-- 开始界面 -->
            <div id="start-screen" class="absolute inset-0 bg-dark/90 flex flex-col justify-center items-center">
                <h2 class="text-4xl font-bold text-secondary mb-8">经典打砖块</h2>
                <button id="start-btn" class="bg-secondary text-dark font-bold py-3 px-8 rounded-lg hover:bg-yellow-400 transition-colors text-xl mb-4">
                    开始游戏
                </button>
                <div class="flex gap-4">
                    <button id="easy-btn" class="bg-green-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-green-700 transition-colors">
                        简单
                    </button>
                    <button id="medium-btn" class="bg-primary text-white font-bold py-2 px-6 rounded-lg hover:bg-blue-700 transition-colors">
                        中等
                    </button>
                    <button id="hard-btn" class="bg-red-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-red-700 transition-colors">
                        困难
                    </button>
                </div>
            </div>
            
            <!-- 游戏结束界面 -->
            <div id="game-over-screen" class="absolute inset-0 bg-dark/90 flex flex-col justify-center items-center hidden">
                <h2 class="text-4xl font-bold text-secondary mb-4" id="game-over-title">游戏结束</h2>
                <p class="text-xl mb-2">得分：<span id="final-score" class="text-secondary font-bold">0</span></p>
                <p class="text-xl mb-2">剩余生命：<span id="final-lives" class="text-secondary font-bold">0</span></p>
                <p class="text-xl mb-8">最高分：<span id="best-score" class="text-secondary font-bold">0</span></p>
                <button id="restart-btn" class="bg-secondary text-dark font-bold py-3 px-8 rounded-lg hover:bg-yellow-400 transition-colors text-xl">
                    再来一局
                </button>
            </div>
            
            <!-- 暂停界面 -->
            <div id="pause-screen" class="absolute inset-0 bg-dark/90 flex flex-col justify-center items-center hidden">
                <h2 class="text-4xl font-bold text-secondary mb-8">游戏暂停</h2>
                <button id="resume-btn" class="bg-secondary text-dark font-bold py-3 px-8 rounded-lg hover:bg-yellow-400 transition-colors text-xl mb-4">
                    继续游戏
                </button>
                <button id="quit-pause-btn" class="bg-red-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-red-700 transition-colors">
                    退出游戏
                </button>
            </div>
        </div>

        <!-- 游戏信息面板 -->
        <div class="bg-dark/70 p-6 rounded-xl border-2 border-secondary min-w-[250px]">
            <h2 class="text-xl font-bold mb-4 text-center">游戏信息</h2>
            <div class="mb-4">
                <p class="mb-2"><span class="text-secondary font-bold">得分：</span> <span id="score">0</span></p>
                <p class="mb-2"><span class="text-secondary font-bold">生命：</span> <span id="lives">3</span></p>
                <p class="mb-2"><span class="text-secondary font-bold">关卡：</span> <span id="level">1</span></p>
                <p class="mb-2"><span class="text-secondary font-bold">难度：</span> <span id="difficulty">简单</span></p>
            </div>
            <div class="flex flex-col gap-3">
                <button id="pause-btn" class="bg-primary text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors">
                    <i class="fa fa-pause"></i> 暂停游戏
                </button>
                <button id="restart-level-btn" class="bg-red-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-red-700 transition-colors">
                    重新开始本关
                </button>
            </div>
            <div class="mt-6">
                <h3 class="text-lg font-bold mb-2 text-secondary">操作说明</h3>
                <ul class="list-disc list-inside text-sm space-y-1">
                    <li>← →：移动挡板</li>
                    <li>A/D：移动挡板</li>
                    <li>空格：发射小球/暂停游戏</li>
                    <li>击碎所有砖块通关</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // 获取画布和上下文
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        // 游戏常量
        const GAME_WIDTH = canvas.width;
        const GAME_HEIGHT = canvas.height;
        const PADDLE_WIDTH = 100;
        const PADDLE_HEIGHT = 15;
        const BALL_SIZE = 10;
        const BRICK_WIDTH = 60;
        const BRICK_HEIGHT = 20;
        const BRICK_ROWS = 5;
        const BRICK_COLS = Math.floor(GAME_WIDTH / (BRICK_WIDTH + 5)) - 1;
        
        // 游戏状态
        let gameState = {
            isPlaying: false,
            isPaused: false,
            score: 0,
            lives: 3,
            level: 1,
            difficulty: 'easy',
            ballSpeed: 5,
            paddleSpeed: 8,
            bricks: [],
            powerUps: [],
            paddle: {
                x: GAME_WIDTH / 2 - PADDLE_WIDTH / 2,
                y: GAME_HEIGHT - 30,
                width: PADDLE_WIDTH,
                height: PADDLE_HEIGHT,
                color: '#fbbf24'
            },
            ball: {
                x: GAME_WIDTH / 2,
                y: GAME_HEIGHT / 2,
                size: BALL_SIZE,
                dx: 0,
                dy: 0,
                color: '#ef4444'
            },
            bestScore: 0,
            animationFrame: null,
            lastTime: 0,
            keys: {
                left: false,
                right: false
            }
        };
        
        // DOM元素
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const pauseScreen = document.getElementById('pause-screen');
        const gameOverTitle = document.getElementById('game-over-title');
        const startBtn = document.getElementById('start-btn');
        const easyBtn = document.getElementById('easy-btn');
        const mediumBtn = document.getElementById('medium-btn');
        const hardBtn = document.getElementById('hard-btn');
        const restartBtn = document.getElementById('restart-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resumeBtn = document.getElementById('resume-btn');
        const quitPauseBtn = document.getElementById('quit-pause-btn');
        const restartLevelBtn = document.getElementById('restart-level-btn');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const levelElement = document.getElementById('level');
        const difficultyElement = document.getElementById('difficulty');
        const finalScoreElement = document.getElementById('final-score');
        const finalLivesElement = document.getElementById('final-lives');
        const bestScoreElement = document.getElementById('best-score');
        
        // 初始化游戏
        function initGame() {
            // 重置游戏状态
            gameState.isPlaying = false;
            gameState.isPaused = false;
            gameState.score = 0;
            gameState.lives = 3;
            gameState.level = 1;
            
            // 根据难度设置参数
            setDifficulty(gameState.difficulty);
            
            // 重置挡板位置
            gameState.paddle.x = GAME_WIDTH / 2 - PADDLE_WIDTH / 2;
            
            // 重置小球位置（未发射状态）
            resetBall();
            
            // 创建砖块
            createBricks();
            
            // 清空道具
            gameState.powerUps = [];
            
            // 更新UI
            scoreElement.textContent = '0';
            livesElement.textContent = gameState.lives;
            levelElement.textContent = gameState.level;
            difficultyElement.textContent = getDifficultyText();
            
            // 显示/隐藏界面
            startScreen.classList.remove('hidden');
            gameOverScreen.classList.add('hidden');
            pauseScreen.classList.add('hidden');
            
            // 从本地存储加载最高分
            gameState.bestScore = localStorage.getItem('breakout-best-score') || 0;
            bestScoreElement.textContent = gameState.bestScore;
        }
        
        // 设置游戏难度
        function setDifficulty(difficulty) {
            gameState.difficulty = difficulty;
            
            switch (difficulty) {
                case 'easy':
                    gameState.ballSpeed = 5;
                    gameState.paddleSpeed = 8;
                    gameState.lives = 5;
                    break;
                case 'medium':
                    gameState.ballSpeed = 6;
                    gameState.paddleSpeed = 7;
                    gameState.lives = 3;
                    break;
                case 'hard':
                    gameState.ballSpeed = 7;
                    gameState.paddleSpeed = 6;
                    gameState.lives = 1;
                    break;
            }
            
            difficultyElement.textContent = getDifficultyText();
            livesElement.textContent = gameState.lives;
        }
        
        // 获取难度文本
        function getDifficultyText() {
            switch (gameState.difficulty) {
                case 'easy': return '简单';
                case 'medium': return '中等';
                case 'hard': return '困难';
                default: return '简单';
            }
        }
        
        // 创建砖块
        function createBricks() {
            gameState.bricks = [];
            const brickColors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
            
            for (let row = 0; row < BRICK_ROWS; row++) {
                for (let col = 0; col < BRICK_COLS; col++) {
                    // 随机跳过一些砖块增加难度
                    if (Math.random() < (gameState.level * 0.05) && gameState.difficulty !== 'easy') {
                        continue;
                    }
                    
                    // 计算砖块位置
                    const x = 30 + col * (BRICK_WIDTH + 5);
                    const y = 50 + row * (BRICK_HEIGHT + 5);
                    
                    // 随机砖块生命值（1-3）
                    const health = Math.floor(Math.random() * 3) + 1;
                    
                    gameState.bricks.push({
                        x,
                        y,
                        width: BRICK_WIDTH,
                        height: BRICK_HEIGHT,
                        color: brickColors[row % brickColors.length],
                        health,
                        maxHealth: health,
                        isBroken: false
                    });
                }
            }
        }
        
        // 重置小球位置
        function resetBall() {
            gameState.ball.x = gameState.paddle.x + gameState.paddle.width / 2;
            gameState.ball.y = gameState.paddle.y - gameState.ball.size;
            gameState.ball.dx = 0;
            gameState.ball.dy = 0;
        }
        
        // 发射小球
        function launchBall() {
            if (gameState.ball.dy === 0) {
                // 随机初始方向
                const angle = (Math.random() * Math.PI / 3) - (Math.PI / 6);
                gameState.ball.dx = Math.sin(angle) * gameState.ballSpeed;
                gameState.ball.dy = -Math.cos(angle) * gameState.ballSpeed;
            }
        }
        
        // 检查碰撞
        function checkCollisions() {
            const ball = gameState.ball;
            const paddle = gameState.paddle;
            
            // 墙壁碰撞检测
            // 左右墙壁
            if (ball.x - ball.size < 0 || ball.x + ball.size > GAME_WIDTH) {
                ball.dx = -ball.dx;
                // 增加一点随机角度变化
                ball.dx += (Math.random() - 0.5) * 0.5;
            }
            
            // 上墙壁
            if (ball.y - ball.size < 0) {
                ball.dy = -ball.dy;
            }
            
            // 下边界（失去生命）
            if (ball.y + ball.size > GAME_HEIGHT) {
                loseLife();
                return;
            }
            
            // 挡板碰撞检测
            if (
                ball.y + ball.size > paddle.y &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width
            ) {
                // 计算碰撞位置（0-1）
                const collidePoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                
                // 计算反弹角度
                const angle = collidePoint * (Math.PI / 3);
                
                // 设置新的速度
                ball.dx = Math.sin(angle) * gameState.ballSpeed;
                ball.dy = -Math.cos(angle) * gameState.ballSpeed;
                
                // 增加一点速度
                gameState.ballSpeed = Math.min(gameState.ballSpeed + 0.05, 10);
            }
            
            // 砖块碰撞检测
            for (let brick of gameState.bricks) {
                if (brick.isBroken) continue;
                
                if (
                    ball.y - ball.size < brick.y + brick.height &&
                    ball.y + ball.size > brick.y &&
                    ball.x - ball.size < brick.x + brick.width &&
                    ball.x + ball.size > brick.x
                ) {
                    // 减少砖块生命值
                    brick.health--;
                    
                    // 增加分数
                    gameState.score += 10 * brick.maxHealth;
                    scoreElement.textContent = gameState.score;
                    
                    // 检查砖块是否被击碎
                    if (brick.health <= 0) {
                        brick.isBroken = true;
                        
                        // 10%概率生成道具
                        if (Math.random() < 0.1) {
                            createPowerUp(brick.x + brick.width / 2, brick.y + brick.height / 2);
                        }
                    }
                    
                    // 反弹小球
                    // 检测碰撞方向
                    const collideFromTop = ball.y + ball.size <= brick.y + brick.height / 2;
                    const collideFromBottom = ball.y - ball.size >= brick.y + brick.height / 2;
                    const collideFromLeft = ball.x + ball.size <= brick.x + brick.width / 2;
                    const collideFromRight = ball.x - ball.size >= brick.x + brick.width / 2;
                    
                    if (collideFromTop || collideFromBottom) {
                        ball.dy = -ball.dy;
                    } else if (collideFromLeft || collideFromRight) {
                        ball.dx = -ball.dx;
                    }
                    
                    // 检查是否通关
                    checkLevelComplete();
                    
                    break;
                }
            }
            
            // 道具碰撞检测
            for (let powerUp of gameState.powerUps) {
                if (
                    powerUp.y + powerUp.size > paddle.y &&
                    powerUp.x > paddle.x &&
                    powerUp.x < paddle.x + paddle.width
                ) {
                    // 应用道具效果
                    applyPowerUp(powerUp.type);
                    
                    // 移除道具
                    gameState.powerUps = gameState.powerUps.filter(p => p !== powerUp);
                }
                
                // 道具超出屏幕
                if (powerUp.y > GAME_HEIGHT) {
                    gameState.powerUps = gameState.powerUps.filter(p => p !== powerUp);
                }
            }
        }
        
        // 创建道具
        function createPowerUp(x, y) {
            const powerUpTypes = ['expand', 'shrink', 'speed', 'slow', 'multi', 'life'];
            const type = powerUpTypes[Math.floor(Math.random() * powerUpTypes.length)];
            
            let color = '#ffffff';
            switch (type) {
                case 'expand': color = '#3b82f6'; break;
                case 'shrink': color = '#ef4444'; break;
                case 'speed': color = '#f59e0b'; break;
                case 'slow': color = '#10b981'; break;
                case 'multi': color = '#8b5cf6'; break;
                case 'life': color = '#10b981'; break;
            }
            
            gameState.powerUps.push({
                x,
                y,
                size: 15,
                type,
                color,
                dy: 3
            });
        }
        
        // 应用道具效果
        function applyPowerUp(type) {
            switch (type) {
                case 'expand':
                    // 扩大挡板
                    gameState.paddle.width = Math.min(PADDLE_WIDTH * 1.5, GAME_WIDTH / 2);
                    setTimeout(() => {
                        gameState.paddle.width = PADDLE_WIDTH;
                    }, 10000);
                    break;
                case 'shrink':
                    // 缩小挡板
                    gameState.paddle.width = Math.max(PADDLE_WIDTH * 0.5, 40);
                    setTimeout(() => {
                        gameState.paddle.width = PADDLE_WIDTH;
                    }, 10000);
                    break;
                case 'speed':
                    // 加速小球
                    gameState.ballSpeed = Math.min(gameState.ballSpeed * 1.3, 12);
                    setTimeout(() => {
                        gameState.ballSpeed = gameState.ballSpeed / 1.3;
                    }, 8000);
                    break;
                case 'slow':
                    // 减速小球
                    gameState.ballSpeed = Math.max(gameState.ballSpeed * 0.7, 3);
                    setTimeout(() => {
                        gameState.ballSpeed = gameState.ballSpeed / 0.7;
                    }, 8000);
                    break;
                case 'multi':
                    // 暂时不实现多球效果
                    gameState.score += 100;
                    scoreElement.textContent = gameState.score;
                    break;
                case 'life':
                    // 增加生命
                    gameState.lives++;
                    livesElement.textContent = gameState.lives;
                    break;
            }
        }
        
        // 失去生命
        function loseLife() {
            gameState.lives--;
            livesElement.textContent = gameState.lives;
            
            // 重置小球
            resetBall();
            
            // 检查游戏是否结束
            if (gameState.lives <= 0) {
                gameOver(false);
            }
        }
        
        // 检查关卡完成
        function checkLevelComplete() {
            // 检查是否所有砖块都被击碎
            const allBroken = gameState.bricks.every(brick => brick.isBroken);
            
            if (allBroken) {
                // 进入下一关
                gameState.level++;
                levelElement.textContent = gameState.level;
                
                // 增加分数奖励
                gameState.score += 500 * gameState.level;
                scoreElement.textContent = gameState.score;
                
                // 重置小球
                resetBall();
                
                // 增加小球速度
                gameState.ballSpeed = Math.min(gameState.ballSpeed + 0.5, 10);
                
                // 创建新的砖块
                createBricks();
                
                // 短暂暂停
                gameState.isPaused = true;
                setTimeout(() => {
                    gameState.isPaused = false;
                }, 1000);
            }
        }
        
        // 游戏结束
        function gameOver(isWin) {
            gameState.isPlaying = false;
            
            // 更新最高分
            if (gameState.score > gameState.bestScore) {
                gameState.bestScore = gameState.score;
                localStorage.setItem('breakout-best-score', gameState.bestScore);
                bestScoreElement.textContent = gameState.bestScore;
            }
            
            // 更新游戏结束界面
            gameOverTitle.textContent = isWin ? '恭喜通关！' : '游戏结束';
            finalScoreElement.textContent = gameState.score;
            finalLivesElement.textContent = gameState.lives;
            
            // 显示游戏结束界面
            gameOverScreen.classList.remove('hidden');
            
            // 取消动画帧
            if (gameState.animationFrame) {
                cancelAnimationFrame(gameState.animationFrame);
            }
        }
        
        // 更新游戏状态
        function updateGame(deltaTime) {
            if (!gameState.isPlaying || gameState.isPaused) return;
            
            // 更新挡板位置
            if (gameState.keys.left && gameState.paddle.x > 0) {
                gameState.paddle.x -= gameState.paddleSpeed;
            }
            
            if (gameState.keys.right && gameState.paddle.x + gameState.paddle.width < GAME_WIDTH) {
                gameState.paddle.x += gameState.paddleSpeed;
            }
            
            // 如果小球未发射，跟随挡板移动
            if (gameState.ball.dy === 0) {
                gameState.ball.x = gameState.paddle.x + gameState.paddle.width / 2;
            } else {
                // 更新小球位置
                gameState.ball.x += gameState.ball.dx;
                gameState.ball.y += gameState.ball.dy;
                
                // 检测碰撞
                checkCollisions();
            }
            
            // 更新道具位置
            for (let powerUp of gameState.powerUps) {
                powerUp.y += powerUp.dy;
            }
        }
        
        // 绘制游戏
        function drawGame() {
            // 清空画布
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            // 绘制砖块
            for (let brick of gameState.bricks) {
                if (brick.isBroken) continue;
                
                // 绘制砖块主体
                ctx.fillStyle = brick.color;
                ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                
                // 绘制砖块边框
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
                
                // 绘制砖块生命值
                if (brick.health < brick.maxHealth) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    const healthWidth = brick.width * (1 - brick.health / brick.maxHealth);
                    ctx.fillRect(brick.x, brick.y, healthWidth, brick.height);
                }
            }
            
            // 绘制挡板
            ctx.fillStyle = gameState.paddle.color;
            ctx.fillRect(gameState.paddle.x, gameState.paddle.y, gameState.paddle.width, gameState.paddle.height);
            
            // 绘制挡板边框
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(game
