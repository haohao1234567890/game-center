<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打砖块游戏 | 复古游戏中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        #gameCanvas {
            touch-action: none;
        }
        .control-btn {
            touch-action: manipulation;
            min-width: 70px;
            min-height: 70px;
        }
        .brick {
            transition: all 0.1s ease;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">
    <!-- 加载遮罩层 -->
    <div id="loader" class="fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-50">
        <i class="fa fa-circle-o-notch fa-spin text-5xl text-green-500 mb-4"></i>
        <p class="text-white text-xl">打砖块游戏加载中...</p>
    </div>

    <!-- 移动端横屏提示 -->
    <div class="md:hidden bg-green-500/20 text-green-800 p-2 text-center text-sm rounded-lg mb-4 w-full max-w-md">
        <i class="fa fa-mobile-phone fa-rotate-90 mr-2"></i> 建议横屏游玩体验更佳
    </div>

    <!-- 游戏标题和分数 -->
    <header class="w-full max-w-md mb-4">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-3xl font-bold text-gray-800">打砖块</h1>
            <div class="bg-gray-800 text-white p-2 rounded-lg text-center">
                <div class="text-xs text-gray-400">分数</div>
                <div id="score" class="text-xl font-bold">0</div>
            </div>
        </div>
        <button id="restart-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition-all active:scale-95">
            <i class="fa fa-refresh mr-2"></i>重新开始
        </button>
    </header>

    <!-- 游戏画布 -->
    <canvas id="gameCanvas" width="400" height="500" class="border-4 border-gray-800 rounded-lg bg-gray-100 max-w-full mb-6"></canvas>

    <!-- 移动端控制按钮 -->
    <div class="md:hidden grid grid-cols-2 gap-4 w-full max-w-md mb-6">
        <button id="left-btn" class="control-btn bg-gray-700 hover:bg-gray-600 text-white rounded-full flex items-center justify-center text-3xl transition-all active:scale-95">
            <i class="fa fa-arrow-left"></i>
        </button>
        <button id="right-btn" class="control-btn bg-gray-700 hover:bg-gray-600 text-white rounded-full flex items-center justify-center text-3xl transition-all active:scale-95">
            <i class="fa fa-arrow-right"></i>
        </button>
    </div>

    <!-- 操作提示 -->
    <div class="text-gray-600 text-center mb-6">
        <p class="md:block hidden"><i class="fa fa-keyboard-o mr-2"></i>使用 ← → 方向键控制挡板移动</p>
        <p class="md:hidden"><i class="fa fa-hand-pointer-o mr-2"></i>点击按钮控制挡板左右移动</p>
    </div>

    <!-- 游戏结束提示 -->
    <div id="game-over" class="fixed inset-0 bg-black/70 flex flex-col items-center justify-center z-40 hidden">
        <div class="bg-white p-6 rounded-xl text-center max-w-xs">
            <h2 id="game-over-title" class="text-2xl font-bold mb-4"></h2>
            <p class="mb-4">最终得分: <span id="final-score" class="font-bold text-xl"></span></p>
            <button id="play-again-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg transition-all active:scale-95">
                <i class="fa fa-play mr-2"></i>再来一局
            </button>
        </div>
    </div>

    <script>
        // 游戏常量
        const CANVAS_WIDTH = 400;
        const CANVAS_HEIGHT = 500;
        const PADDLE_WIDTH = 80;
        const PADDLE_HEIGHT = 15;
        const BALL_SIZE = 10;
        const BRICK_ROWS = 5;
        const BRICK_COLS = 8;
        const BRICK_WIDTH = 45;
        const BRICK_HEIGHT = 20;
        const BRICK_GAP = 5;

        // 游戏变量
        let canvas, ctx;
        let paddle = {
            x: CANVAS_WIDTH / 2 - PADDLE_WIDTH / 2,
            y: CANVAS_HEIGHT - 40,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            speed: 8
        };
        let ball = {
            x: CANVAS_WIDTH / 2,
            y: CANVAS_HEIGHT / 2,
            size: BALL_SIZE,
            dx: 4,
            dy: -4,
            speed: 4
        };
        let bricks = [];
        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let gameLoopId;

        // DOM元素
        const scoreDisplay = document.getElementById('score');
        const restartBtn = document.getElementById('restart-btn');
        const playAgainBtn = document.getElementById('play-again-btn');
        const gameOverScreen = document.getElementById('game-over');
        const gameOverTitle = document.getElementById('game-over-title');
        const finalScoreDisplay = document.getElementById('final-score');
        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');

        // 初始化游戏
        function initGame() {
            // 获取画布和上下文
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            // 重置游戏状态
            paddle.x = CANVAS_WIDTH / 2 - PADDLE_WIDTH / 2;
            ball.x = CANVAS_WIDTH / 2;
            ball.y = CANVAS_HEIGHT / 2;
            ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -4;
            score = 0;
            lives = 3;
            isGameOver = false;
            gameOverScreen.classList.add('hidden');
            
            // 更新分数显示
            updateScore();
            
            // 创建砖块
            createBricks();
            
            // 开始游戏循环
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        // 创建砖块
        function createBricks() {
            bricks = [];
            const brickColors = ['#e74c3c', '#f39c12', '#f1c40f', '#2ecc71', '#3498db'];
            
            for (let row = 0; row < BRICK_ROWS; row++) {
                for (let col = 0; col < BRICK_COLS; col++) {
                    const x = col * (BRICK_WIDTH + BRICK_GAP) + BRICK_GAP * 2;
                    const y = row * (BRICK_HEIGHT + BRICK_GAP) + 50;
                    
                    bricks.push({
                        x: x,
                        y: y,
                        width: BRICK_WIDTH,
                        height: BRICK_HEIGHT,
                        color: brickColors[row],
                        isBroken: false
                    });
                }
            }
        }

        // 绘制挡板
        function drawPaddle() {
            ctx.fillStyle = '#3498db';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            
            // 挡板细节
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(paddle.x + 5, paddle.y + 3, paddle.width - 10, paddle.height - 6);
        }

        // 绘制小球
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);
            ctx.fillStyle = '#e74c3c';
            ctx.fill();
            ctx.closePath();
            
            // 小球高光
            ctx.beginPath();
            ctx.arc(ball.x - 3, ball.y - 3, ball.size / 3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fill();
            ctx.closePath();
        }

        // 绘制砖块
        function drawBricks() {
            bricks.forEach(brick => {
                if (!brick.isBroken) {
                    ctx.fillStyle = brick.color;
                    ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                    
                    // 砖块高光
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fillRect(brick.x, brick.y, brick.width, brick.height / 2);
                    
                    // 砖块边框
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
                }
            });
        }

        // 移动挡板
        function movePaddle(direction) {
            if (isGameOver) return;
            
            if (direction === 'left' && paddle.x > 0) {
                paddle.x -= paddle.speed;
            } else if (direction === 'right' && paddle.x < CANVAS_WIDTH - paddle.width) {
                paddle.x += paddle.speed;
            }
        }

        // 移动小球
        function moveBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // 碰撞检测 - 左右墙壁
            if (ball.x - ball.size < 0 || ball.x + ball.size > CANVAS_WIDTH) {
                ball.dx *= -1;
                playSound('wall');
            }
            
            // 碰撞检测 - 顶部墙壁
            if (ball.y - ball.size < 0) {
                ball.dy *= -1;
                playSound('wall');
            }
            
            // 碰撞检测 - 底部（游戏失败）
            if (ball.y + ball.size > CANVAS_HEIGHT) {
                lives--;
                if (lives <= 0) {
                    gameOver(false);
                } else {
                    resetBall();
                }
            }
            
            // 碰撞检测 - 挡板
            if (
                ball.y + ball.size > paddle.y &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width
            ) {
                // 根据碰撞位置调整反弹角度
                const collidePoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                const angle = collidePoint * (Math.PI / 3);
                
                ball.dx = ball.speed * Math.sin(angle);
                ball.dy = -ball.speed * Math.cos(angle);
                
                playSound('paddle');
            }
            
            // 碰撞检测 - 砖块
            bricks.forEach(brick => {
                if (!brick.isBroken) {
                    if (
                        ball.x + ball.size > brick.x &&
                        ball.x - ball.size < brick.x + brick.width &&
                        ball.y + ball.size > brick.y &&
                        ball.y - ball.size < brick.y + brick.height
                    ) {
                        // 标记砖块为已破碎
                        brick.isBroken = true;
                        
                        // 反弹小球
                        ball.dy *= -1;
                        
                        // 加分
                        score += 10;
                        updateScore();
                        
                        playSound('brick');
                        
                        // 检查是否所有砖块都被击碎
                        checkWin();
                    }
                }
            });
        }

        // 重置小球位置
        function resetBall() {
            ball.x = CANVAS_WIDTH / 2;
            ball.y = CANVAS_HEIGHT / 2;
            ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -4;
        }

        // 更新分数显示
        function updateScore() {
            scoreDisplay.textContent = score;
            finalScoreDisplay.textContent = score;
            
            // 分数变化动画
            scoreDisplay.classList.add('scale-110');
            setTimeout(() => {
                scoreDisplay.classList.remove('scale-110');
            }, 200);
        }

        // 播放音效（模拟）
        function playSound(type) {
            // 可以在这里添加实际的音效播放代码
            if (type === 'brick') {
                // 砖块破碎音效
                const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQGAAAGbwFHWmNtdBVrcGdr/4gxAAD8/wAAAP8AAAD/AAD//wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
