<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048游戏 | 复古游戏中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        .tile {
            transition: all 0.2s ease;
        }
        .control-btn {
            touch-action: manipulation;
            min-width: 60px;
            min-height: 60px;
        }
        .score-change {
            animation: scorePulse 0.5s ease;
        }
        @keyframes scorePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .key-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            color: rgba(255, 255, 255, 0.5);
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            animation: keyHintFade 0.2s ease;
        }
        @keyframes keyHintFade {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">
    <!-- 加载遮罩层 -->
    <div id="loader" class="fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-50">
        <i class="fa fa-circle-o-notch fa-spin text-5xl text-yellow-400 mb-4"></i>
        <p class="text-white text-xl">2048游戏加载中...</p>
    </div>

    <!-- 移动端横屏提示 -->
    <div class="md:hidden bg-yellow-500/20 text-yellow-800 p-2 text-center text-sm rounded-lg mb-4 w-full max-w-md">
        <i class="fa fa-mobile-phone fa-rotate-90 mr-2"></i> 建议横屏游玩体验更佳
    </div>

    <!-- 游戏标题和分数 -->
    <header class="w-full max-w-md mb-4">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-3xl font-bold text-gray-800">2048</h1>
            <div class="bg-gray-800 text-white p-2 rounded-lg text-center">
                <div class="text-xs text-gray-400">分数</div>
                <div id="score" class="text-xl font-bold">0</div>
            </div>
        </div>
        <button id="restart-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition-all active:scale-95">
            <i class="fa fa-refresh mr-2"></i>重新开始
        </button>
    </header>

    <!-- 游戏棋盘 -->
    <div id="game-board" class="grid grid-cols-4 gap-2 bg-gray-800 p-2 rounded-lg mb-6 w-full max-w-md aspect-square"></div>

    <!-- 移动端控制按钮 -->
    <div class="md:hidden grid grid-cols-3 gap-3 w-full max-w-md mb-6">
        <div class="col-start-2">
            <button class="control-btn bg-gray-700 hover:bg-gray-600 text-white rounded-lg flex items-center justify-center text-2xl transition-all active:scale-95" data-direction="up">
                <i class="fa fa-arrow-up"></i>
            </button>
        </div>
        <div class="col-start-1">
            <button class="control-btn bg-gray-700 hover:bg-gray-600 text-white rounded-lg flex items-center justify-center text-2xl transition-all active:scale-95" data-direction="left">
                <i class="fa fa-arrow-left"></i>
            </button>
        </div>
        <div class="col-start-2">
            <button class="control-btn bg-gray-700 hover:bg-gray-600 text-white rounded-lg flex items-center justify-center text-2xl transition-all active:scale-95" data-direction="down">
                <i class="fa fa-arrow-down"></i>
            </button>
        </div>
        <div class="col-start-3">
            <button class="control-btn bg-gray-700 hover:bg-gray-600 text-white rounded-lg flex items-center justify-center text-2xl transition-all active:scale-95" data-direction="right">
                <i class="fa fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- 操作提示 -->
    <div class="text-gray-600 text-center mb-6">
        <p class="md:block hidden"><i class="fa fa-keyboard-o mr-2"></i>使用方向键控制数字移动</p>
        <p class="md:hidden"><i class="fa fa-hand-pointer-o mr-2"></i>点击下方按钮控制数字移动</p>
    </div>

    <!-- 游戏结束提示 -->
    <div id="game-over" class="fixed inset-0 bg-black/70 flex flex-col items-center justify-center z-40 hidden">
        <div class="bg-white p-6 rounded-xl text-center max-w-xs">
            <h2 class="text-2xl font-bold text-red-600 mb-4">游戏结束！</h2>
            <p class="mb-4">最终得分: <span id="final-score" class="font-bold text-xl"></span></p>
            <button id="play-again-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg transition-all active:scale-95">
                <i class="fa fa-play mr-2"></i>再来一局
            </button>
        </div>
    </div>

    <script>
        // 游戏核心变量
        const boardSize = 4;
        let board = [];
        let score = 0;
        let isGameOver = false;

        // DOM元素
        const gameBoard = document.getElementById('game-board');
        const scoreDisplay = document.getElementById('score');
        const restartBtn = document.getElementById('restart-btn');
        const playAgainBtn = document.getElementById('play-again-btn');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const controlButtons = document.querySelectorAll('.control-btn');

        // 初始化游戏
        function initGame() {
            // 重置游戏状态
            board = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
            score = 0;
            isGameOver = false;
            gameOverScreen.classList.add('hidden');
            
            // 更新分数显示
            updateScore(0);
            
            // 生成初始两个数字
            generateRandomTile();
            generateRandomTile();
            
            // 渲染棋盘
            renderBoard();
        }

        // 生成随机数字块
        function generateRandomTile() {
            // 找到所有空位置
            const emptyTiles = [];
            for (let i = 0; i < boardSize; i++) {
                for (let j = 0; j < boardSize; j++) {
                    if (board[i][j] === 0) {
                        emptyTiles.push({ x: i, y: j });
                    }
                }
            }

            // 没有空位置则游戏结束
            if (emptyTiles.length === 0) {
                checkGameOver();
                return;
            }

            // 随机选择一个空位置
            const randomTile = emptyTiles[Math.floor(Math.random() * emptyTiles.length)];
            // 90%概率生成2，10%概率生成4
            board[randomTile.x][randomTile.y] = Math.random() < 0.9 ? 2 : 4;
        }

        // 渲染游戏棋盘
        function renderBoard() {
            // 清空棋盘
            gameBoard.innerHTML = '';

            // 渲染每个格子
            for (let i = 0; i < boardSize; i++) {
                for (let j = 0; j < boardSize; j++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile', 'rounded-lg', 'flex', 'items-center', 'justify-center', 'text-2xl', 'font-bold');
                    
                    // 根据数字设置背景色
                    const value = board[i][j];
                    if (value !== 0) {
                        tile.textContent = value;
                        // 不同数字不同颜色
                        const colorMap = {
                            2: 'bg-yellow-100 text-gray-800',
                            4: 'bg-yellow-200 text-gray-800',
                            8: 'bg-orange-300 text-white',
                            16: 'bg-orange-400 text-white',
                            32: 'bg-orange-500 text-white',
                            64: 'bg-red-500 text-white',
                            128: 'bg-yellow-300 text-white',
                            256: 'bg-yellow-400 text-white',
                            512: 'bg-yellow-500 text-white',
                            1024: 'bg-yellow-600 text-white',
                            2048: 'bg-yellow-700 text-white',
                        };
                        tile.classList.add(...(colorMap[value] || 'bg-red-600 text-white'));
                    } else {
                        tile.classList.add('bg-gray-700');
                    }

                    gameBoard.appendChild(tile);
                }
            }
        }

        // 移动数字块 - 向左
        function slideLeft() {
            let moved = false;
            
            for (let i = 0; i < boardSize; i++) {
                // 过滤掉0，只保留有数字的格子
                const row = board[i].filter(cell => cell !== 0);
                const newRow = [];
                
                // 合并相同数字
                for (let j = 0; j < row.length; j++) {
                    if (j < row.length - 1 && row[j] === row[j + 1]) {
                        // 合并数字
                        const mergedValue = row[j] * 2;
                        newRow.push(mergedValue);
                        // 更新分数
                        updateScore(score + mergedValue);
                        j++; // 跳过下一个数字
                        moved = true;
                    } else {
                        newRow.push(row[j]);
                    }
                }
                
                // 补0
                while (newRow.length < boardSize) {
                    newRow.push(0);
                }
                
                // 检查是否有移动
                if (JSON.stringify(board[i]) !== JSON.stringify(newRow)) {
                    moved = true;
                }
                
                // 更新行
                board[i] = newRow;
            }
            
            // 如果有移动，生成新数字
            if (moved) {
                generateRandomTile();
                checkGameOver();
            }
            
            return moved;
        }

        // 移动数字块 - 向右
        function slideRight() {
            // 旋转棋盘180度，向左移动，再旋转回来
            rotateBoard(2);
            const moved = slideLeft();
            rotateBoard(2);
            return moved;
        }

        // 移动数字块 - 向上
        function slideUp() {
            // 旋转棋盘270度，向左移动，再旋转90度
            rotateBoard(3);
            const moved = slideLeft();
            rotateBoard(1);
            return moved;
        }

        // 移动数字块 - 向下
        function slideDown() {
            // 旋转棋盘90度，向左移动，再旋转270度
            rotateBoard(1);
            const moved = slideLeft();
            rotateBoard(3);
            return moved;
        }

        // 旋转棋盘
        function rotateBoard(rotations) {
            for (let r = 0; r < rotations; r++) {
                // 转置矩阵
                const newBoard = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
                for (let i = 0; i < boardSize; i++) {
                    for (let j = 0; j < boardSize; j++) {
                        newBoard[i][j] = board[boardSize - 1 - j][i];
                    }
                }
                board = newBoard;
            }
        }

        // 更新分数（带动画）
        function updateScore(newScore) {
            const oldScore = score;
            score = newScore;
            
            // 分数变化动画
            scoreDisplay.classList.add('score-change');
            setTimeout(() => {
                scoreDisplay.classList.remove('score-change');
            }, 500);
            
            // 平滑数字变化
            const diff = score - oldScore;
            if (diff > 0) {
                let current = oldScore;
                const step = Math.ceil(diff / 10); // 分10步完成
                const timer = setInterval(() => {
                    current += step;
                    if (current >= score) {
                        current = score;
                        clearInterval(timer);
                    }
                    scoreDisplay.textContent = current;
                }, 30);
            } else {
                scoreDisplay.textContent = score;
            }
        }

        // 检查游戏是否结束
        function checkGameOver() {
            // 检查是否有空位
            for (let i = 0; i < boardSize; i++) {
                for (let j = 0; j < boardSize; j++) {
                    if (board[i][j] === 0) {
                        return false;
                    }
                }
            }

            // 检查是否有可合并的数字
            for (let i = 0; i < boardSize; i++) {
                for (let j = 0; j < boardSize; j++) {
                    const current = board[i][j];
                    // 检查右侧
                    if (j < boardSize - 1 && current === board[i][j + 1]) {
                        return false;
                    }
                    // 检查下方
                    if (i < boardSize - 1 && current === board[i + 1][j]) {
                        return false;
                    }
                }
            }

            // 游戏结束
            isGameOver = true;
            finalScoreDisplay.textContent = score;
            gameOverScreen.classList.remove('hidden');
            return true;
        }

        // 方向键控制
        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            
            // 方向键提示
            const keyMap = { 
                'ArrowUp': '↑', 
                'ArrowDown': '↓', 
                'ArrowLeft': '←', 
                'ArrowRight': '→' 
            };
            if (keyMap[e.key]) {
                const hint = document.createElement('div');
                hint.classList.add('key-hint');
                hint.textContent = keyMap[e.key];
                document.body.appendChild(hint);
                setTimeout(() => hint.remove(), 200);
            }

            // 阻止默认行为（如页面滚动）
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                
                switch (e.key) {
                    case 'ArrowLeft':
                        slideLeft();
                        break;
                    case 'ArrowRight':
                        slideRight();
                        break;
                    case 'ArrowUp':
                        slideUp();
                        break;
                    case 'ArrowDown':
                        slideDown();
                        break;
                }
                
                renderBoard();
            }
        });

        // 移动端按钮控制
        controlButtons.forEach(button => {
            button.addEventListener('click', () => {
                if (isGameOver) return;
                
                const direction = button.dataset.direction;
                switch (direction) {
                    case 'left':
                        slideLeft();
                        break;
                    case 'right':
                        slideRight();
                        break;
                    case 'up':
                        slideUp();
                        break;
                    case 'down':
                        slideDown();
                        break;
                }
                
                renderBoard();
            });
        });

        // 重新开始游戏
        restartBtn.addEventListener('click', initGame);
        playAgainBtn.addEventListener('click', initGame);

        // 页面加载完成后隐藏加载层
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = 0;
                loader.style.transition = 'opacity 0.5s ease';
                setTimeout(() => {
                    loader.style.display = 'none';
                    // 初始化游戏
                    initGame();
                }, 500);
            }, 500);
        });
    </script>
</body>
</html>
