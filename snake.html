    <!-- JavaScript -->
    <script>
        // 移动端菜单切换
        document.getElementById('mobile-menu-button').addEventListener('click', function() {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
        });

        // 游戏变量
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let gameSpeed = 150; // 毫秒
        let gameInterval;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gamePaused = false;
        const gridSize = 20;
        const gridWidth = canvas.width / gridSize;
        const gridHeight = canvas.height / gridSize;

        // 初始化游戏
        function initGame() {
            // 重置蛇
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            
            // 重置方向
            direction = 'right';
            nextDirection = 'right';
            
            // 生成食物
            generateFood();
            
            // 重置分数
            score = 0;
            updateScore();
            
            // 更新最高分显示
            document.getElementById('high-score').textContent = highScore;
            
            // 更新蛇长度显示
            document.getElementById('snake-length').textContent = snake.length;
            
            // 隐藏所有屏幕
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('pause-screen').classList.add('hidden');
            
            // 绘制游戏
            drawGame();
        }

        // 生成食物
        function generateFood() {
            let newFood;
            let foodOnSnake;
            
            do {
                foodOnSnake = false;
                newFood = {
                    x: Math.floor(Math.random() * gridWidth),
                    y: Math.floor(Math.random() * gridHeight)
                };
                
                // 检查食物是否生成在蛇身上
                for (let segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        foodOnSnake = true;
                        break;
                    }
                }
            } while (foodOnSnake);
            
            food = newFood;
        }

        // 更新游戏状态
        function updateGame() {
            if (!gameRunning || gamePaused) return;
            
            // 更新方向
            direction = nextDirection;
            
            // 获取蛇头
            const head = { x: snake[0].x, y: snake[0].y };
            
            // 根据方向移动蛇头
            switch (direction) {
                case 'up':
                    head.y--;
                    break;
                case 'down':
                    head.y++;
                    break;
                case 'left':
                    head.x--;
                    break;
                case 'right':
                    head.x++;
                    break;
            }
            
            // 检查是否撞墙
            if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight) {
                gameOver();
                return;
            }
            
            // 检查是否撞到自己
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    gameOver();
                    return;
                }
            }
            
            // 将新头部添加到蛇
            snake.unshift(head);
            
            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                // 增加分数
                score += 10;
                updateScore();
                
                // 生成新食物
                generateFood();
                
                // 增加游戏速度
                if (gameSpeed > 80) {
                    gameSpeed -= 2;
                    clearInterval(gameInterval);
                    gameInterval = setInterval(updateGame, gameSpeed);
                }
            } else {
                // 如果没吃到食物，移除尾部
                snake.pop();
            }
            
            // 更新蛇长度显示
            document.getElementById('snake-length').textContent = snake.length;
            
            // 绘制游戏
            drawGame();
        }

        // 绘制游戏
        function drawGame() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格（可选）
            drawGrid();
            
            // 绘制蛇
            drawSnake();
            
            // 绘制食物
            drawFood();
        }

        // 绘制网格
        function drawGrid() {
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 0.5;
            
            // 绘制垂直线
            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            // 绘制水平线
            for (let y = 0; y <= canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // 绘制蛇
        function drawSnake() {
            // 绘制蛇头
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(snake[0].x * gridSize, snake[0].y * gridSize, gridSize, gridSize);
            
            // 绘制蛇头眼睛
            ctx.fillStyle = '#ffffff';
            const eyeSize = gridSize / 4;
            const eyeOffset = gridSize / 3;
            
            switch (direction) {
                case 'up':
                    ctx.fillRect(snake[0].x * gridSize + eyeOffset, snake[0].y * gridSize + eyeOffset, eyeSize, eyeSize);
                    ctx.fillRect(snake[0].x * gridSize + gridSize - eyeOffset - eyeSize, snake[0].y * gridSize + eyeOffset, eyeSize, eyeSize);
                    break;
                case 'down':
                    ctx.fillRect(snake[0].x * gridSize + eyeOffset, snake[0].y * gridSize + gridSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                    ctx.fillRect(snake[0].x * gridSize + gridSize - eyeOffset - eyeSize, snake[0].y * gridSize + gridSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                    break;
                case 'left':
                    ctx.fillRect(snake[0].x * gridSize + eyeOffset, snake[0].y * gridSize + eyeOffset, eyeSize, eyeSize);
                    ctx.fillRect(snake[0].x * gridSize + eyeOffset, snake[0].y * gridSize + gridSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                    break;
                case 'right':
                    ctx.fillRect(snake[0].x * gridSize + gridSize - eyeOffset - eyeSize, snake[0].y * gridSize + eyeOffset, eyeSize, eyeSize);
                    ctx.fillRect(snake[0].x * gridSize + gridSize - eyeOffset - eyeSize, snake[0].y * gridSize + gridSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                    break;
            }
            
            // 绘制蛇身体
            for (let i = 1; i < snake.length; i++) {
                // 交替颜色创建条纹效果
                ctx.fillStyle = i % 2 === 0 ? '#22c55e' : '#16a34a';
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize, gridSize);
                
                // 添加边框
                ctx.strokeStyle = '#064e3b';
                ctx.lineWidth = 1;
                ctx.strokeRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize, gridSize);
            }
        }

        // 绘制食物
        function drawFood() {
            // 绘制食物主体
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
            
            // 添加食物光泽效果
            ctx.fillStyle = '#fca5a5';
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);
            
            // 添加食物边框
            ctx.strokeStyle = '#b91c1c';
            ctx.lineWidth = 1;
            ctx.strokeRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
        }

        // 更新分数显示
        function updateScore() {
            document.getElementById('current-score').textContent = score;
            
            // 更新最高分
            if (score > highScore) {
                highScore = score;
                document.getElementById('high-score').textContent = highScore;
                localStorage.setItem('snakeHighScore', highScore);
            }
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            clearInterval(gameInterval);
            
            // 更新最终分数
            document.getElementById('final-score').textContent = score;
            
            // 显示游戏结束屏幕
            document.getElementById('game-over-screen').classList.remove('hidden');
            
            // 更新按钮状态
            document.getElementById('start-btn').disabled = false;
            document.getElementById('pause-btn').disabled = true;
            document.getElementById('pause-btn').textContent = '暂停游戏';
        }

        // 开始游戏
        function startGame() {
            if (gameRunning && !gamePaused) return;
            
            if (!gameRunning) {
                // 初始化游戏
                initGame();
                gameRunning = true;
                gamePaused = false;
                
                // 开始游戏循环
                gameInterval = setInterval(updateGame, gameSpeed);
            } else if (gamePaused) {
                // 恢复游戏
                gamePaused = false;
                document.getElementById('pause-screen').classList.add('hidden');
                gameInterval = setInterval(updateGame, gameSpeed);
            }
            
            // 更新按钮状态
            document.getElementById('start-btn').disabled = true;
            document.getElementById('pause-btn').disabled = false;
        }

        // 暂停游戏
        function pauseGame() {
            if (!gameRunning || gamePaused) return;
            
            gamePaused = true;
            clearInterval(gameInterval);
            document.getElementById('pause-screen').classList.remove('hidden');
        }

        // 重置游戏
        function resetGame() {
            gameRunning = false;
            gamePaused = false;
            clearInterval(gameInterval);
            
            // 重置分数
            score = 0;
            updateScore();
            
            // 显示开始屏幕
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('pause-screen').classList.add('hidden');
            
            // 更新按钮状态
            document.getElementById('start-btn').disabled = false;
            document.getElementById('pause-btn').disabled = true;
            document.getElementById('pause-btn').textContent = '暂停游戏';
        }

        // 处理键盘输入
        document.addEventListener('keydown', function(e) {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction !== 'down') {
                        nextDirection = 'up';
                    }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction !== 'up') {
                        nextDirection = 'down';
                    }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction !== 'right') {
                        nextDirection = 'left';
                    }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction !== 'left') {
                        nextDirection = 'right';
                    }
                    break;
                case ' ':
                case 'p':
                case 'P':
                    if (gameRunning && !gamePaused) {
                        pauseGame();
                    } else if (gamePaused) {
                        startGame();
                    }
                    break;
                case 'Enter':
                    if (!gameRunning) {
                        startGame();
                    }
                    break;
                case 'r':
                case 'R':
                    resetGame();
                    break;
            }
        });

        // 按钮事件监听
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('pause-btn').addEventListener('click', function() {
            if (gamePaused) {
                startGame();
            } else {
                pauseGame();
            }
        });
        document.getElementById('reset-btn').addEventListener('click', resetGame);
        document.getElementById('start-game-btn').addEventListener('click', startGame);
        document.getElementById('play-again-btn').addEventListener('click', startGame);
        document.getElementById('resume-btn').addEventListener('click', startGame);

        // 移动设备控制
        document.querySelectorAll('.control-btn').forEach(button => {
            button.addEventListener('touchstart', function(e) {
                e.preventDefault();
                const dir = this.getAttribute('data-direction');
                
                switch (dir) {
                    case 'up':
                        if (direction !== 'down') {
                            nextDirection = 'up';
                        }
                        break;
                    case 'down':
                        if (direction !== 'up') {
                            nextDirection = 'down';
                        }
                        break;
                    case 'left':
                        if (direction !== 'right') {
                            nextDirection = 'left';
                        }
                        break;
                    case 'right':
                        if (direction !== 'left') {
                            nextDirection = 'right';
                        }
                        break;
                }
            });
        });

        // 初始化游戏
        window.onload = function() {
            // 初始化游戏
            initGame();
            
            // 更新最高分显示
            document.getElementById('high-score').textContent = highScore;
        };
    </script>
</body>
</html>
